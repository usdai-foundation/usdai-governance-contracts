[profile.default]
solc = "0.8.33"
src = "src"
out = "out"
libs = ["lib"]
via-ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./deployments/"}]

[fmt]
bracket_spacing = false
int_types = "long"
line_length = 120
multiline_func_header = "params_first"
quote_style = "double"
tab_width = 4
wrap_comments = true

[lint]
exclude_lints = ["mixed-case-function", "mixed-case-variable", "unused-import", "screaming-snake-case-immutable", "unwrapped-modifier-logic", "unsafe-cheatcode", "erc20-unchecked-transfer"]
